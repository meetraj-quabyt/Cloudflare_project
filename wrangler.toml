name = "cloudshare"
main = "worker/index.js"
compatibility_date = "2026-10-30"

[[containers]]
name = "backend"
image = "./backend"
port = 8000
instance_count = 1

[[containers]]
name = "frontend"
image = "./frontend"
port = 80
instance_count = 1

[[d1_databases]]
binding = "DB"
database_name = "cloudshare-db"
database_id = "951b7f52-83ff-4b5e-b881-cb72820e4e4e"

[[r2_buckets]]
binding = "R2"
bucket_name = "cloudshare-files"

[vars]
ENVIRONMENT = "production"
CF_D1_DATABASE_ID = "951b7f52-83ff-4b5e-b881-cb72820e4e4e"
