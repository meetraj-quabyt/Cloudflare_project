version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite+aiosqlite:///./cloudshare.db
    env_file: .env
    volumes:
      # Mount source for quick iteration; remove in production-like testing
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
